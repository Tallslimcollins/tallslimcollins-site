<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TallSlimCollins | The Evangelist</title>
    <meta name="description" content="Stevan Collins Lazich - The Evangelist. Memphis-based creative, home revivalist, and truth-teller.">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --sage: #7A9B93;
            --cream: #F5F1E8;
            --brown: #3D2817;
            --gold: #C19A6B;
            --rose-gold: #B76E79;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--sage) 0%, #6B8A82 50%, var(--sage) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated background pattern */
        body:before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(255,255,255,0.03) 2px,
                    rgba(255,255,255,0.03) 4px
                );
            pointer-events: none;
            z-index: 0;
        }
        
        /* Floating ornamental elements */
        .ornament {
            position: fixed;
            opacity: 0.1;
            pointer-events: none;
            color: var(--brown);
            font-size: 4rem;
            animation: float 20s ease-in-out infinite;
        }
        
        .ornament:nth-child(1) {
            top: 10%;
            left: 5%;
            animation-delay: 0s;
        }
        
        .ornament:nth-child(2) {
            top: 70%;
            right: 10%;
            animation-delay: 5s;
        }
        
        .ornament:nth-child(3) {
            bottom: 15%;
            left: 15%;
            animation-delay: 10s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(5deg); }
            50% { transform: translateY(0px) rotate(0deg); }
            75% { transform: translateY(-15px) rotate(-5deg); }
        }
        
        /* Main container */
        .container {
            position: relative;
            z-index: 1;
            max-width: 500px;
            width: 100%;
            background: var(--cream);
            border: 4px solid var(--brown);
            box-shadow: 
                0 0 0 8px var(--sage),
                0 0 0 12px var(--brown),
                0 25px 50px rgba(0,0,0,0.3);
            padding: 3rem 2rem;
            text-align: center;
            position: relative;
        }
        
        /* Decorative corners */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid var(--gold);
        }
        
        .corner.top-left {
            top: -3px;
            left: -3px;
            border-right: none;
            border-bottom: none;
        }
        
        .corner.top-right {
            top: -3px;
            right: -3px;
            border-left: none;
            border-bottom: none;
        }
        
        .corner.bottom-left {
            bottom: -3px;
            left: -3px;
            border-right: none;
            border-top: none;
        }
        
        .corner.bottom-right {
            bottom: -3px;
            right: -3px;
            border-left: none;
            border-top: none;
        }
        
        /* Profile section */
        .profile-badge {
            width: 180px;
            height: 180px;
            margin: 0 auto 2rem;
            position: relative;
            animation: gentleFloat 6s ease-in-out infinite;
        }
        
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .badge-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid var(--brown);
            background: var(--sage);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 
                0 0 0 8px var(--cream),
                0 0 0 12px var(--gold),
                0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .badge-circle img {
            width: 85%;
            height: 85%;
            object-fit: contain;
        }
        
        .badge-circle:before {
            content: '★';
            position: absolute;
            top: -25px;
            font-size: 2rem;
            color: var(--gold);
        }
        
        /* Logo placeholder */
        .logo-placeholder {
            font-size: 5rem;
            line-height: 1;
        }
        
        /* Name and title */
        .name {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--brown);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }
        
        .alter-ego {
            font-family: 'Libre Baskerville', serif;
            font-size: 1rem;
            color: var(--sage);
            font-style: italic;
            margin-bottom: 0.5rem;
        }
        
        .tagline {
            font-size: 0.85rem;
            color: var(--gold);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }
        
        .location {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 2rem;
        }
        
        /* Divider */
        .divider {
            width: 80px;
            height: 3px;
            background: linear-gradient(to right, transparent, var(--gold), transparent);
            margin: 2rem auto;
            position: relative;
        }
        
        .divider:before {
            content: '◆';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--cream);
            color: var(--gold);
            padding: 0 10px;
            font-size: 0.8rem;
        }
        
        /* Links section */
        .links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .link-button {
            display: block;
            padding: 1rem 2rem;
            background: white;
            border: 3px solid var(--brown);
            color: var(--brown);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .link-button:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(193, 154, 107, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .link-button:hover:before {
            left: 100%;
        }
        
        .link-button:hover {
            background: var(--brown);
            color: var(--cream);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        
        .link-button .icon {
            margin-right: 0.5rem;
            font-size: 1.2rem;
        }
        
        /* Primary link - special styling */
        .link-button.primary {
            background: var(--brown);
            color: var(--cream);
            border-color: var(--brown);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }
        
        .link-button.primary:before {
            background: linear-gradient(90deg, transparent, rgba(193, 154, 107, 0.3), transparent);
        }
        
        .link-button.primary:hover {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--cream);
        }
        
        /* Social links */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .social-link {
            width: 50px;
            height: 50px;
            border: 3px solid var(--brown);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--brown);
            font-size: 1.3rem;
            transition: all 0.3s ease;
            background: white;
            position: relative;
        }
        
        .social-link:hover {
            background: var(--brown);
            color: var(--cream);
            transform: translateY(-5px) rotate(5deg);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        
        /* Footer quote */
        .footer-quote {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(61, 40, 23, 0.2);
            font-family: 'Libre Baskerville', serif;
            font-style: italic;
            color: #666;
            font-size: 0.85rem;
            line-height: 1.6;
        }
        
        /* Mobile responsive */
        @media (max-width: 600px) {
            .container {
                padding: 2rem 1.5rem;
            }
            
            .name {
                font-size: 2rem;
            }
            
            .profile-badge {
                width: 150px;
                height: 150px;
            }
            
            .link-button {
                padding: 0.9rem 1.5rem;
                font-size: 0.85rem;
            }
        }
        
        /* Loading animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .container {
            animation: fadeIn 0.8s ease-out;
        }
        
        .link-button {
            animation: fadeIn 0.8s ease-out backwards;
        }
        
        .link-button:nth-child(1) { animation-delay: 0.1s; }
        .link-button:nth-child(2) { animation-delay: 0.2s; }
        .link-button:nth-child(3) { animation-delay: 0.3s; }
        .link-button:nth-child(4) { animation-delay: 0.4s; }
        .link-button:nth-child(5) { animation-delay: 0.5s; }
        .link-button:nth-child(6) { animation-delay: 0.6s; }
        .link-button:nth-child(7) { animation-delay: 0.7s; }
    </style>
</head>
